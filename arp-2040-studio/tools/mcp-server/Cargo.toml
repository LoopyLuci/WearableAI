[package]
name = "arp-2040-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arp_2040_mcp"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "cargo"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serialport = { version = "4.9.0", features = ["default"] }
