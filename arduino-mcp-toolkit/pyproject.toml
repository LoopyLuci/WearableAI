[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arduino-mcp-toolkit"
version = "1.0.0"
description = "Agentic Arduino MCP toolkit — compile, flash, debug, learn, mesh, self-modify. Designed for 100-year modularity."
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "Hermes Agent", email = "hermes@nousresearch.com"}
]
keywords = ["arduino", "mcp", "arduino-nano-rp2040-connect", "tinyml", "wearable-ai", "agentic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPL-3.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

dependencies = [
    "mcp>=1.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "msgpack>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
arduino-mcp = "arduino_mcp_toolkit.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arduino_mcp_toolkit" = [
    "config/*.json",
    "examples/*.ino",
    "docs/*.md",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
