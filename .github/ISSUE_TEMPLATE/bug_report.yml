name: Bug report
about: Report a reproducible bug or unexpected behavior
title: "[Bug] "
labels: bug
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug. Please fill in as much detail as you can so we can reproduce and fix it quickly.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which subproject does this affect?
      options:
        - arp-2040 firmware
        - arp-2040 host-tools
        - arduino-mcp-toolkit
        - arduino-dashboard
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, precise steps or code to trigger the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include logs, stack traces, or error output.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, board, firmware version, browser, etc.
