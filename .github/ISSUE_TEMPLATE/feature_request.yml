name: Feature request
about: Suggest a new capability or improvement
title: "[Feature] "
labels: enhancement
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please describe the problem you want to solve and the outcome you want, not just a proposed implementation.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line summary of the feature.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which subproject would this affect?
      options:
        - arp-2040 firmware
        - arp-2040 host-tools
        - arduino-mcp-toolkit
        - arduino-dashboard
        - docs
        - cross-cutting / repo-wide
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or API shape at a high level.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, sketches, or related issues.
