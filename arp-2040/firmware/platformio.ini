; PlatformIO configuration for ARP-2040 Connect
; https://docs.platformio.org/page/projectconf.html

[env:nanorp2040connect]
platform = https://github.com/platformio/platform-raspberrypi.git
board = nanorp2040connect
framework = arduino
board_build.f_cpu = 133000000L

; Build flags
build_flags =
    -Wall -Wextra -Werror -Wno-unused-parameter
    -DDEBUG=1
    -DCORE_DEBUG_LEVEL=3
    -I$PROJECT_DIR/include

; Source files
src_filter = +<*> -<.git/> -<.svn/> -<.github/>

; Libraries
lib_deps =
    https://github.com/earlephilhower/arduino-pico.git#2.6.0
    arduino-libraries/WiFiNINA@^1.8.14
    arduino-libraries/ArduinoBLE@^1.3.6
    https://github.com/tensorflow/tflite-micro.git#2.5.0
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/littlefs-project/littlefs.git#2.2.1

; Monitor speed
monitor_speed = 921600

; Upload speed
upload_speed = 921600

; Filesystem
board_build.filesystem = littlefs

; Extra script: copy models to data directory before upload
extra_scripts = pre:scripts/copy_models.py
