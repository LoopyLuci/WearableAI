site_name: ARP-2040 Documentation
site_url: https://arp-2040.nousresearch.com
repo_url: https://github.com/your-org/arp-2040

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Blueprint: blueprint.md
  - Build Plan: 100Year_Build_Plan.md
  - HAL Spec: hal-spec.md
  - Protocol: protocol-spec.md
  - API Reference: api-reference.md
  - Build Guide: build-guide.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
