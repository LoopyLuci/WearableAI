site_name: ARP-2040 Documentation
site_url: https://arp-2040.nousresearch.com
repo_url: https://github.com/LoopyLuci/WearableAI/tree/main/arp-2040
docs_dir: docs
site_dir: ../site

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - HAL Specification: hal-spec.md
  - Wire Protocol: protocol-spec.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

plugins:
  - search
